app = "bound-relayer"
primary_region = "sin"

[build]

[env]
  NODE_ENV = "production"
  PORT = "4000"
  HOST = "0.0.0.0"
  DB_PATH = "/data/relayer.db"
  CHAIN_ID = "11155111"
  OTP_MODE = "mock"
  JWT_TTL_SECONDS = "900"
  LOG_LEVEL = "info"

[[mounts]]
  source = "bound_relayer_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
